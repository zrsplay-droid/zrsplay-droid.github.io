<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZRS MOV</title>
<meta name="description" content="김지연 | Video Creator & Editor — 트레일러닝·아웃도어 대회 영상 촬영/편집">
<meta property="og:title" content="ZRS MOV — 김지연 | Video Creator & Editor">
<meta property="og:description" content="트레일러닝·아웃도어 대회 영상 촬영/편집">
<meta property="og:image" content="images/profile.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{--fg:#212121;--muted:#8a8a8a;--line:#e5e5e5;--box:#eeeeee;--bg:#ffffff;
  --sans:"Lato","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}

/* 왼쪽 고정 사이드바 */
.side{position:fixed;top:0;left:0;width:220px;height:100vh;padding:56px 0 0 40px;font-size:12px;color:var(--muted);line-height:1.9}
.side .name{color:var(--fg);font-size:13px;font-weight:700;margin-bottom:22px;letter-spacing:.02em}
.side p{margin:0}
.side .gap{height:16px}
.side a{text-decoration:none}
.side a:hover{color:var(--fg)}
.side .ig{display:inline-flex;margin-top:18px;color:var(--fg)}
.side .ig svg{width:20px;height:20px}

main{margin-left:220px;padding:56px 40px 80px;max-width:1240px}
.head{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.head .bar{width:1px;height:18px;background:#bdbdbd}
.head small{font-size:16px;font-weight:400;color:#555}

.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.top .photo img{width:100%;height:auto}
.career{background:var(--box);padding:26px 28px 24px}
.career h2{font-size:16px;font-weight:500;margin:0 0 16px}
.career ul{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.85}
.career .sub{display:block;padding-left:28px;color:#444}

hr{border:0;border-top:1px solid var(--line);margin:40px 0}
.intro p{margin:0 0 18px;font-size:13px;line-height:1.95;color:#333}

.label{display:flex;align-items:center;gap:12px;font-size:13px;margin:0 0 32px}
.label::before{content:"";width:3px;height:26px;background:#bdbdbd}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:48px}
.cell{position:relative;display:block;padding:0;border:0;background:#f2f2f2;aspect-ratio:4/3;overflow:hidden;cursor:pointer;font:inherit;color:inherit}
div.cell{cursor:default}
.cell img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.cell:hover img{transform:scale(1.04)}
.cell:focus-visible{outline:3px solid #212121;outline-offset:2px}
.play{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.play::after{content:"";position:absolute;left:10px;top:7px;border-left:9px solid #212121;border-top:6px solid transparent;border-bottom:6px solid transparent}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .25s}
.cell:hover .cap,.cell:focus-visible .cap{opacity:1}
footer{border-top:1px solid #212121;padding-top:18px;font-size:11px;color:var(--muted)}

/* 라이트박스 */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:48px 16px}
.lb.open{display:flex}
.lb .frame{width:min(1100px,100%);aspect-ratio:16/9;background:#000}
.lb .frame iframe{width:100%;height:100%;border:0}
.lb .pic{max-width:min(1400px,100%);max-height:100%;object-fit:contain}
.lb .x{position:absolute;top:12px;right:16px;width:40px;height:40px;border:0;background:none;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:26px;cursor:pointer}
.lb .prev{left:8px}.lb .next{right:8px}

@media (max-width:960px){
  .side{position:static;width:auto;height:auto;padding:28px 20px 0;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
  .side .name{width:100%;margin-bottom:4px}
  .side .gap{display:none}
  .side .ig{margin-top:0}
  main{margin-left:0;padding:24px 20px 60px}
  .top{grid-template-columns:1fr}
}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .head{font-size:19px}.head small{font-size:14px}
  .career{padding:20px}
  hr{margin:30px 0}
  .cap{opacity:1}
}
@media (prefers-reduced-motion:reduce){.cell img{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>

<main>
  <h1 class="head" id="head"></h1>
  <section class="top">
    <div class="photo"><img id="profilePhoto" alt="" width="1280" height="854"></div>
    <div class="career"><h2 id="careerTitle"></h2><ul id="career"></ul></div>
  </section>
  <hr>
  <section class="intro" id="intro"></section>
  <hr>
  <h2 class="label">촬영 현장</h2>
  <div class="grid" id="fields"></div>
  <h2 class="label">Mov</h2>
  <div class="grid" id="movs"></div>
  <footer id="foot"></footer>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="미리보기">
  <button class="x" id="lbx" aria-label="닫기">×</button>
  <button class="nav prev" id="lbp" aria-label="이전">‹</button>
  <div id="lbc"></div>
  <button class="nav next" id="lbn" aria-label="다음">›</button>
</div>

<script>
const lb=document.getElementById('lb'), box=document.getElementById('lbc');
let list=[], idx=0, last=null;
function show(){
  const el=list[idx];
  if(el.dataset.yt){box.className='frame';box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${el.dataset.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="영상"></iframe>`;}
  else {box.className='';box.innerHTML=`<img class="pic" src="${el.dataset.img}" alt="">`;}
}
function open(el){last=el;list=[...el.parentElement.querySelectorAll('[data-yt],[data-img]')];idx=list.indexOf(el);show();lb.classList.add('open');document.body.style.overflow='hidden';document.getElementById('lbx').focus();}
function close(){lb.classList.remove('open');box.innerHTML='';document.body.style.overflow='';last&&last.focus();}
function step(d){idx=(idx+d+list.length)%list.length;show();}
document.getElementById('lbx').onclick=close;
document.getElementById('lbp').onclick=()=>step(-1);
document.getElementById('lbn').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)close();});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
</script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ytThumb=id=>`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
async function render(){
  const d=await fetch('content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  const p=d.profile;
  document.getElementById('side').innerHTML=`<div class="name">${esc(p.nameEn)}</div><div class="gap"></div>
    <p><a href="tel:${esc(p.phone.replace(/[^+0-9]/g,''))}">${esc(p.phone)}</a></p>
    <p><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></p><div class="gap"></div><p>${esc(p.location)}</p>
    ${p.instagram?`<a class="ig" href="${esc(p.instagram)}" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>`:''}`;
  document.getElementById('head').innerHTML=`${esc(p.nameKo)} <span class="bar"></span> <small>${esc(p.role)}</small>`;
  const ph=document.getElementById('profilePhoto'); ph.src=p.photo; ph.alt=p.nameKo;
  document.getElementById('careerTitle').textContent=d.careerTitle;
  document.getElementById('career').innerHTML=d.career.map(c=>`<li>${esc(c.text)}${(c.subs||[]).filter(Boolean).map(s=>`<span class="sub">+ ${esc(s)}</span>`).join('')}</li>`).join('');
  document.getElementById('intro').innerHTML=d.intro.filter(x=>x.trim()).map(x=>`<p>${esc(x).replace(/\n/g,'<br>')}</p>`).join('');
  document.getElementById('fields').innerHTML=d.fields.map((f,i)=>`<button class="cell" data-img="${esc(f.img)}" aria-label="촬영 현장 사진 ${i+1} 크게 보기"><img src="${esc(f.img)}" alt="촬영 현장 ${i+1}" loading="lazy"></button>`).join('');
  document.getElementById('movs').innerHTML=d.videos.map((v,i)=>{
    const t=v.title||`영상 ${i+1}`, th=v.thumb||(v.yt?ytThumb(v.yt):''), cap=v.title?`<span class="cap">${esc(v.title)}</span>`:'';
    const img=`<img src="${esc(th)}" alt="${esc(t)}" loading="lazy">`;
    return v.yt?`<button class="cell vid" data-yt="${esc(v.yt)}" aria-label="${esc(t)} 재생">${img}<span class="play"></span>${cap}</button>`:`<div class="cell">${img}${cap}</div>`;}).join('');
  document.getElementById('foot').textContent=`© ZRS MOV · ${p.nameEn}`;
  document.querySelectorAll('[data-yt],[data-img]').forEach(el=>el.addEventListener('click',()=>open(el)));
}
render();
</script>
</body>
</html>
